name: CI

# Valida cada push a main y cada pull request: salud de dependencias, tipos y tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Doctor · Typecheck · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # firebase.config.ts está en .gitignore; en un clon limpio no existe.
      # Las API keys web de Firebase son públicas por diseño (no son secretos).
      - name: Generar firebase.config.ts desde el example
        run: cp firebase.config.example.ts firebase.config.ts

      # Detecta desajustes de versiones de paquetes Expo (p. ej. expo-font fuera
      # del rango del SDK), que provocan crashes nativos al arrancar.
      - name: Expo Doctor
        run: npx --yes expo-doctor@latest

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:ci
