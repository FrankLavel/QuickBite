name: CI

# Valida cada push a main y cada pull request:
#  - quality: typecheck + tests de TODOS los workspaces (mobile, dashboard, driver, shared).
#  - rules:   Security Rules de Firestore contra el emulador (Java 21 + firebase-tools).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install (workspaces)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  rules:
    name: Firestore Rules (emulador)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install (workspaces)
        run: npm ci

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Rules tests
        run: npm run test:rules -w apps/mobile
