name: CI

# Valida cada push a main y cada pull request: tipos, lint y tests.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Typecheck · Lint · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # firebase.config.ts está en .gitignore; en un clon limpio no existe.
      # Las API keys web de Firebase son públicas por diseño (no son secretos),
      # y el example trae la config real del proyecto, suficiente para compilar.
      - name: Generar firebase.config.ts desde el example
        run: cp firebase.config.example.ts firebase.config.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test:ci
